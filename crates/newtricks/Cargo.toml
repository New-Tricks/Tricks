[package]
name = "newtricks"
version = "0.6.0"
edition = "2024"
description = "New Tricks: teach your agents new tricks. The design-time workbench for agent skills: federated search, customization with upstream merges, branch experiments, lint and publish."
license = "Apache-2.0"
repository = "https://github.com/new-tricks/tricks"
homepage = "https://new-tricks.github.io/tricks/"
documentation = "https://new-tricks.github.io/tricks/"
keywords = ["agent-skills", "claude-code", "codex", "copilot", "cursor"]
categories = ["command-line-utilities", "development-tools"]
readme = "../../README.md"

[lib]
name = "newtricks"
path = "src/lib.rs"

[[bin]]
name = "tricks"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
dirs = "7.0.0"
flate2 = "1.1.10"
globset = "0.4.20"
hex = "0.4.3"
is-terminal = "0.4.17"
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
sha1 = "0.11.0"
sha2 = "0.11.0"
similar = "3.2.0"
spdx = { version = "0.13.5", features = ["detection-inline-cache"] }
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "parsing", "macros"] }
toml = "1.1.6"
toml_edit = "0.25.15"
unicode-normalization = "0.1.25"
ureq = { version = "3.4.2", features = ["json"] }
walkdir = "2.5.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
