name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Configure git identity for tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main
      - run: cargo build --locked
      - run: cargo test --locked
        env:
          TRICKS_NO_GH: "1"

  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npx tsc -p .
      - run: npm test
      - run: npx vsce package --no-dependencies -o new-tricks.vsix

  extension-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extension host test against the real binary
        working-directory: extension
        run: |
          npm ci --no-audit --no-fund
          npx tsc -p .
          xvfb-run -a node out/test/runTest.js

  ecosystem:
    # Acceptance scenario 8: a published repo installs via npx skills, APM and Claude Code.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v6
      - run: npm install -g @anthropic-ai/claude-code
      - name: Install a published repository through every ecosystem
        run: |
          git config --global user.name CI
          git config --global user.email ci@example.com
          scripts/ecosystem-test.sh target/release/tricks
