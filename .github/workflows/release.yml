name: Release

# Tag vX.Y.Z to build binaries, checksums and platform VSIX packages, then (when
# secrets are configured) publish to the VS Code Marketplace and Open VSX and update
# the Homebrew tap.
on:
  push:
    tags: ["v*"]
  # Re-run marketplace publishing for an existing release (e.g. after a transient
  # Marketplace error). Versions already published are skipped.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish, e.g. v0.1.0
        required: true

permissions:
  contents: write

jobs:
  binaries:
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest, vsce: darwin-arm64 }
          - { target: x86_64-apple-darwin, os: macos-latest, vsce: darwin-x64 }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest, vsce: linux-x64 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm, vsce: linux-arm64 }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, vsce: win32-x64 }
          - { target: aarch64-pc-windows-msvc, os: windows-latest, vsce: win32-arm64 }
    runs-on: ${{ matrix.os }}
    env:
      APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package binary
        shell: bash
        run: |
          set -euo pipefail
          exe=tricks
          [[ "${{ matrix.target }}" == *windows* ]] && exe=tricks.exe
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/$exe" dist/
          cp LICENSE README.md dist/
          tar -C dist -czf "tricks-${{ matrix.target }}.tar.gz" "$exe" LICENSE README.md
          if command -v sha256sum >/dev/null; then sha256sum "tricks-${{ matrix.target }}.tar.gz" > "tricks-${{ matrix.target }}.tar.gz.sha256";
          else shasum -a 256 "tricks-${{ matrix.target }}.tar.gz" > "tricks-${{ matrix.target }}.tar.gz.sha256"; fi
          # Stage the binary for the platform-specific VSIX.
          mkdir -p "extension/bin" && cp "dist/$exe" "extension/bin/$exe"
      # macOS signing/notarization: set APPLE_* secrets to enable (see packaging/README.md).
      - name: Sign macOS binary
        if: startsWith(matrix.os, 'macos') && env.APPLE_CERT_P12 != ''
        run: echo "codesign/notarize step goes here (see packaging/README.md)"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build platform VSIX
        shell: bash
        working-directory: extension
        run: |
          npm ci --no-audit --no-fund
          npx tsc -p .
          npx vsce package --no-dependencies --target ${{ matrix.vsce }} -o "../new-tricks-${{ matrix.vsce }}.vsix"
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.target }}
          path: |
            tricks-*.tar.gz
            tricks-*.tar.gz.sha256
            new-tricks-*.vsix

  release:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

  publish:
    needs: release
    if: always() && (needs.release.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Download VSIX files from the release
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.vsix' --dir artifacts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # TODO: switch to a Microsoft Entra identity (no stored secret): azure/login over OIDC,
      # then `vsce publish --azure-credential`, and delete VSCE_PAT. See packaging/README.md#later.
      - name: Publish to VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: for f in artifacts/*.vsix; do npx @vscode/vsce publish --skip-duplicate --packagePath "$f" --pat "$VSCE_PAT"; done
      - name: Publish to Open VSX
        if: ${{ !cancelled() && env.OVSX_PAT != '' }}
        run: for f in artifacts/*.vsix; do npx ovsx publish --skip-duplicate "$f" --pat "$OVSX_PAT"; done

  homebrew:
    needs: release
    if: always() && (needs.release.result == 'success' || github.event_name == 'workflow_dispatch')
    # macOS runners have Homebrew preinstalled (for `brew style`).
    runs-on: macos-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      TAP_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
    steps:
      # The workflow's own commit: the tag on release, the dispatching branch on re-runs.
      - uses: actions/checkout@v4
        with:
          path: tricks
      - uses: actions/checkout@v4
        if: env.TAP_KEY != ''
        with:
          repository: new-tricks/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap
      - name: Render and push the formula
        if: env.TAP_KEY != ''
        run: |
          set -euo pipefail
          tricks/packaging/homebrew/render.sh "$TAG" > tap/Formula/tricks.rb
          brew style tap/Formula/tricks.rb
          cd tap
          # The formula was `newtricks` until 0.6: drop it and let `brew update` migrate installs.
          rm -f Formula/newtricks.rb
          echo '{ "newtricks": "tricks" }' > formula_renames.json
          git add -A
          if [ -z "$(git status --porcelain)" ]; then echo "Formula already up to date"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "tricks ${TAG#v}"
          git push
